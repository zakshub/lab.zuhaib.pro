<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="700" viewBox="0 0 1120 700" role="img" aria-labelledby="title desc">
  <title id="title">ScribeCheck Review workbench UI</title>
  <desc id="desc">High fidelity interface reference for a clinician reviewing an AI generated clinical note.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#08111f"/>
      <stop offset="0.55" stop-color="#0d1724"/>
      <stop offset="1" stop-color="#0f1c18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#22c55e"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#000" flood-opacity="0.34"/>
    </filter>
  </defs>
  <rect width="1120" height="700" fill="url(#bg)"/>
  <circle cx="916" cy="96" r="240" fill="#22c55e" opacity="0.12"/>
  <circle cx="120" cy="630" r="260" fill="#0ea5e9" opacity="0.1"/>
  <rect x="52" y="46" width="1016" height="608" rx="30" fill="#0b1220" stroke="#203449" filter="url(#shadow)"/>
  <rect x="52" y="46" width="1016" height="70" rx="30" fill="#111c2b"/>
  <text x="88" y="90" fill="#f8fafc" font-size="24" font-family="Inter, Arial, sans-serif" font-weight="700">ScribeCheck Review</text>
  <text x="350" y="90" fill="#94a3b8" font-size="14" font-family="Inter, Arial, sans-serif">AI note review workbench</text>
  <rect x="880" y="66" width="146" height="32" rx="16" fill="url(#accent)"/>
  <text x="914" y="87" fill="#03111a" font-size="13" font-family="Inter, Arial, sans-serif" font-weight="700">Ready to sign</text>

  <rect x="82" y="144" width="244" height="470" rx="22" fill="#0f1a2a" stroke="#23364b"/>
  <text x="108" y="180" fill="#e2e8f0" font-size="16" font-family="Inter, Arial, sans-serif" font-weight="700">Review queue</text>
  <rect x="108" y="204" width="190" height="42" rx="12" fill="#152438" stroke="#2c4259"/>
  <text x="128" y="230" fill="#cbd5e1" font-size="13" font-family="Inter, Arial, sans-serif">Today, 14 notes</text>
  <rect x="108" y="270" width="190" height="76" rx="16" fill="#163326" stroke="#22c55e"/>
  <text x="128" y="298" fill="#dcfce7" font-size="14" font-family="Inter, Arial, sans-serif" font-weight="700">A. Rahman</text>
  <text x="128" y="324" fill="#86efac" font-size="12" font-family="Inter, Arial, sans-serif">2 uncertain sections</text>
  <rect x="108" y="360" width="190" height="76" rx="16" fill="#121f31" stroke="#263a50"/>
  <text x="128" y="388" fill="#e2e8f0" font-size="14" font-family="Inter, Arial, sans-serif" font-weight="700">M. Iqbal</text>
  <text x="128" y="414" fill="#94a3b8" font-size="12" font-family="Inter, Arial, sans-serif">Medication check</text>
  <rect x="108" y="450" width="190" height="76" rx="16" fill="#121f31" stroke="#263a50"/>
  <text x="128" y="478" fill="#e2e8f0" font-size="14" font-family="Inter, Arial, sans-serif" font-weight="700">S. Khan</text>
  <text x="128" y="504" fill="#94a3b8" font-size="12" font-family="Inter, Arial, sans-serif">Needs sign-off</text>

  <rect x="354" y="144" width="458" height="470" rx="22" fill="#f8fafc"/>
  <text x="390" y="186" fill="#0f172a" font-size="20" font-family="Inter, Arial, sans-serif" font-weight="800">Clinical note draft</text>
  <text x="390" y="214" fill="#64748b" font-size="13" font-family="Inter, Arial, sans-serif">Generated from ambient visit audio</text>
  <rect x="390" y="244" width="360" height="14" rx="7" fill="#cbd5e1"/>
  <rect x="390" y="274" width="320" height="14" rx="7" fill="#e2e8f0"/>
  <rect x="390" y="304" width="380" height="14" rx="7" fill="#e2e8f0"/>
  <rect x="390" y="346" width="360" height="82" rx="18" fill="#ecfdf5" stroke="#22c55e"/>
  <text x="414" y="378" fill="#14532d" font-size="14" font-family="Inter, Arial, sans-serif" font-weight="800">Assessment</text>
  <text x="414" y="406" fill="#166534" font-size="13" font-family="Inter, Arial, sans-serif">AI confidence high. Clinician review still required.</text>
  <rect x="390" y="452" width="360" height="82" rx="18" fill="#fff7ed" stroke="#f97316"/>
  <text x="414" y="484" fill="#9a3412" font-size="14" font-family="Inter, Arial, sans-serif" font-weight="800">Medication mention</text>
  <text x="414" y="512" fill="#9a3412" font-size="13" font-family="Inter, Arial, sans-serif">Check dosage phrase before sign-off.</text>

  <rect x="840" y="144" width="198" height="470" rx="22" fill="#0f1a2a" stroke="#23364b"/>
  <text x="866" y="180" fill="#e2e8f0" font-size="16" font-family="Inter, Arial, sans-serif" font-weight="700">Risk flags</text>
  <rect x="866" y="212" width="146" height="50" rx="14" fill="#2a1f13" stroke="#f97316"/>
  <text x="886" y="242" fill="#fed7aa" font-size="13" font-family="Inter, Arial, sans-serif" font-weight="700">Medication</text>
  <rect x="866" y="282" width="146" height="50" rx="14" fill="#13281e" stroke="#22c55e"/>
  <text x="886" y="312" fill="#bbf7d0" font-size="13" font-family="Inter, Arial, sans-serif" font-weight="700">Assessment</text>
  <rect x="866" y="352" width="146" height="50" rx="14" fill="#142538" stroke="#0ea5e9"/>
  <text x="886" y="382" fill="#bae6fd" font-size="13" font-family="Inter, Arial, sans-serif" font-weight="700">Plan</text>
  <rect x="866" y="520" width="146" height="48" rx="16" fill="url(#accent)"/>
  <text x="898" y="550" fill="#03111a" font-size="13" font-family="Inter, Arial, sans-serif" font-weight="800">Sign note</text>
</svg>
