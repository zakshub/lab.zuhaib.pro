<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="700" viewBox="0 0 1120 700" role="img" aria-labelledby="title desc">
  <title id="title">ScribeCheck risk detail UI</title>
  <desc id="desc">Detailed clinical review state for medication and treatment verification.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#07131b"/>
      <stop offset="1" stop-color="#101827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#22c55e"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
  </defs>
  <rect width="1120" height="700" fill="url(#bg)"/>
  <rect x="58" y="58" width="1004" height="584" rx="32" fill="#f8fafc"/>
  <rect x="58" y="58" width="1004" height="70" rx="32" fill="#102033"/>
  <text x="94" y="102" fill="#f8fafc" font-size="22" font-family="Inter, Arial, sans-serif" font-weight="800">Risk detail</text>
  <text x="250" y="102" fill="#94a3b8" font-size="14" font-family="Inter, Arial, sans-serif">Medication and treatment review</text>
  <rect x="886" y="80" width="132" height="28" rx="14" fill="#dcfce7"/>
  <text x="915" y="99" fill="#166534" font-size="12" font-family="Inter, Arial, sans-serif" font-weight="800">Human review</text>

  <rect x="94" y="162" width="280" height="426" rx="22" fill="#eef2f7"/>
  <text x="124" y="202" fill="#0f172a" font-size="18" font-family="Inter, Arial, sans-serif" font-weight="800">AI statements</text>
  <rect x="124" y="232" width="220" height="76" rx="16" fill="#fff7ed" stroke="#fb923c"/>
  <text x="144" y="262" fill="#9a3412" font-size="13" font-family="Inter, Arial, sans-serif" font-weight="800">Check medication</text>
  <text x="144" y="286" fill="#9a3412" font-size="12" font-family="Inter, Arial, sans-serif">Phrase may need edit</text>
  <rect x="124" y="328" width="220" height="76" rx="16" fill="#ecfdf5" stroke="#22c55e"/>
  <text x="144" y="358" fill="#166534" font-size="13" font-family="Inter, Arial, sans-serif" font-weight="800">Stable finding</text>
  <text x="144" y="382" fill="#166534" font-size="12" font-family="Inter, Arial, sans-serif">Confidence high</text>
  <rect x="124" y="424" width="220" height="76" rx="16" fill="#eff6ff" stroke="#0ea5e9"/>
  <text x="144" y="454" fill="#075985" font-size="13" font-family="Inter, Arial, sans-serif" font-weight="800">Plan wording</text>
  <text x="144" y="478" fill="#075985" font-size="12" font-family="Inter, Arial, sans-serif">Needs final tone</text>

  <rect x="414" y="162" width="396" height="426" rx="22" fill="#ffffff" stroke="#dbe3ee"/>
  <text x="448" y="204" fill="#0f172a" font-size="22" font-family="Inter, Arial, sans-serif" font-weight="900">Medication checkpoint</text>
  <text x="448" y="236" fill="#64748b" font-size="14" font-family="Inter, Arial, sans-serif">Compare generated note with clinician-approved facts.</text>
  <rect x="448" y="274" width="310" height="94" rx="18" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="472" y="306" fill="#92400e" font-size="13" font-family="Inter, Arial, sans-serif" font-weight="900">Generated statement</text>
  <text x="472" y="334" fill="#92400e" font-size="15" font-family="Inter, Arial, sans-serif">Dose phrase uncertain</text>
  <rect x="448" y="392" width="310" height="94" rx="18" fill="#ecfdf5" stroke="#22c55e"/>
  <text x="472" y="424" fill="#166534" font-size="13" font-family="Inter, Arial, sans-serif" font-weight="900">Clinician action</text>
  <text x="472" y="452" fill="#166534" font-size="15" font-family="Inter, Arial, sans-serif">Edit before sign-off</text>
  <rect x="448" y="518" width="144" height="40" rx="16" fill="#e2e8f0"/>
  <text x="480" y="544" fill="#0f172a" font-size="13" font-family="Inter, Arial, sans-serif" font-weight="800">Send back</text>
  <rect x="608" y="518" width="150" height="40" rx="16" fill="url(#accent)"/>
  <text x="642" y="544" fill="#03111a" font-size="13" font-family="Inter, Arial, sans-serif" font-weight="900">Approve edit</text>

  <rect x="842" y="162" width="176" height="426" rx="22" fill="#0f1a2a"/>
  <text x="870" y="204" fill="#e2e8f0" font-size="16" font-family="Inter, Arial, sans-serif" font-weight="800">Audit trail</text>
  <circle cx="884" cy="250" r="7" fill="#22c55e"/>
  <rect x="904" y="244" width="82" height="12" rx="6" fill="#d1fae5"/>
  <circle cx="884" cy="314" r="7" fill="#f97316"/>
  <rect x="904" y="308" width="96" height="12" rx="6" fill="#fed7aa"/>
  <circle cx="884" cy="378" r="7" fill="#0ea5e9"/>
  <rect x="904" y="372" width="72" height="12" rx="6" fill="#bae6fd"/>
  <rect x="870" y="494" width="116" height="46" rx="16" fill="#16263a" stroke="#2b4158"/>
  <text x="892" y="523" fill="#cbd5e1" font-size="12" font-family="Inter, Arial, sans-serif" font-weight="800">Needs review</text>
</svg>
