<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="700" viewBox="0 0 1120 700" role="img" aria-labelledby="title desc">
  <title id="title">Boundary Guard UI reference</title>
  <desc id="desc">High fidelity interface reference for a guided boundary setting conversation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#08201a"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#10b981"/>
      <stop offset="1" stop-color="#14b8a6"/>
    </linearGradient>
  </defs>
  <rect width="1120" height="700" fill="url(#bg)"/>
  <rect x="70" y="58" width="980" height="584" rx="32" fill="#0b151a" stroke="#1f3a35"/>
  <text x="108" y="106" fill="#ecfdf5" font-size="25" font-family="Inter, Arial, sans-serif" font-weight="900">Boundary Guard</text>
  <text x="320" y="106" fill="#99f6e4" font-size="14" font-family="Inter, Arial, sans-serif">Reflection before response</text>
  <rect x="108" y="154" width="300" height="440" rx="24" fill="#111827" stroke="#25364a"/>
  <text x="138" y="198" fill="#e2e8f0" font-size="18" font-family="Inter, Arial, sans-serif" font-weight="800">Name the tension</text>
  <rect x="138" y="236" width="214" height="58" rx="18" fill="#dcfce7"/>
  <text x="164" y="272" fill="#166534" font-size="13" font-family="Inter, Arial, sans-serif" font-weight="800">I feel pressured to reply fast</text>
  <rect x="168" y="322" width="204" height="58" rx="18" fill="#13231f" stroke="#10b981"/>
  <text x="194" y="358" fill="#a7f3d0" font-size="13" font-family="Inter, Arial, sans-serif" font-weight="800">What do you need?</text>
  <rect x="138" y="418" width="214" height="104" rx="20" fill="#ecfeff" stroke="#14b8a6"/>
  <text x="164" y="454" fill="#115e59" font-size="13" font-family="Inter, Arial, sans-serif" font-weight="900">Draft boundary</text>
  <text x="164" y="482" fill="#115e59" font-size="12" font-family="Inter, Arial, sans-serif">I can talk tonight, but I need time to think first.</text>
  <rect x="450" y="154" width="282" height="440" rx="24" fill="#f8fafc"/>
  <text x="482" y="198" fill="#0f172a" font-size="20" font-family="Inter, Arial, sans-serif" font-weight="900">Conversation frame</text>
  <rect x="482" y="238" width="198" height="52" rx="16" fill="#d1fae5"/>
  <text x="510" y="271" fill="#166534" font-size="13" font-family="Inter, Arial, sans-serif" font-weight="900">Need: breathing room</text>
  <rect x="482" y="314" width="198" height="52" rx="16" fill="#ccfbf1"/>
  <text x="510" y="347" fill="#115e59" font-size="13" font-family="Inter, Arial, sans-serif" font-weight="900">Tone: calm, direct</text>
  <rect x="482" y="390" width="198" height="52" rx="16" fill="#e0f2fe"/>
  <text x="510" y="423" fill="#075985" font-size="13" font-family="Inter, Arial, sans-serif" font-weight="900">Action: send later</text>
  <rect x="482" y="500" width="198" height="48" rx="16" fill="url(#accent)"/>
  <text x="534" y="530" fill="#042019" font-size="13" font-family="Inter, Arial, sans-serif" font-weight="900">Review draft</text>
  <rect x="774" y="154" width="238" height="440" rx="24" fill="#111827" stroke="#25364a"/>
  <text x="804" y="198" fill="#e2e8f0" font-size="18" font-family="Inter, Arial, sans-serif" font-weight="800">Safety checks</text>
  <rect x="804" y="236" width="160" height="58" rx="18" fill="#13231f" stroke="#10b981"/>
  <text x="832" y="271" fill="#a7f3d0" font-size="13" font-family="Inter, Arial, sans-serif" font-weight="800">No diagnosis</text>
  <rect x="804" y="318" width="160" height="58" rx="18" fill="#13231f" stroke="#10b981"/>
  <text x="832" y="353" fill="#a7f3d0" font-size="13" font-family="Inter, Arial, sans-serif" font-weight="800">No escalation</text>
  <rect x="804" y="400" width="160" height="58" rx="18" fill="#13231f" stroke="#10b981"/>
  <text x="832" y="435" fill="#a7f3d0" font-size="13" font-family="Inter, Arial, sans-serif" font-weight="800">Human choice</text>
</svg>
